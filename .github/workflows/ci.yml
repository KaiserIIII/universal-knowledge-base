name: SaaS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install audited core dependencies
        run: python -m pip install -r backend/requirements-core.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Offline synthetic API tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q backend/app tests start.py
      - name: Browser module behavior
        run: node --test tests/web/*.test.mjs
